# CI: the Fragiola project jobs, with the Playwright suites split out of Checks.
#
#   Checks   Biome, TypeScript, the unit tests and the build (with the .d.ts check).
#   E2E      the Playwright suites, in parallel jobs: the playground (Chromium and Firefox: the
#            scroll scaling and focus specs run in both) and the examples app. The playground's
#            dev server serves the packages from source, so its job builds nothing; the examples
#            suite builds the embed against the packages' dist, so its job builds the packages.
#
# Tests run only on pull requests (and on a manual run): with one coordinator merging one PR at a
# time, main is what its PR tested.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  e2e:
    name: E2E (${{ matrix.name }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: playground
            id: playground
            package: playground
            dir: apps/playground
            browsers: chromium firefox
          - name: examples
            id: examples
            package: examples-react
            dir: examples/react
            browsers: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The examples suite builds the embed against the packages' dist (its playwright.config.ts).
      - name: Build the packages
        if: matrix.package == 'examples-react'
        run: pnpm --filter "./packages/*" build

      - name: Install Playwright browsers
        working-directory: ${{ matrix.dir }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browsers }}

      - name: Run Playwright
        run: pnpm --filter ${{ matrix.package }} run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.id }}
          path: ${{ matrix.dir }}/playwright-report/
          retention-days: 14
